name: DIAG issue-3

# Temporary: exists only on diag/issue-3-propagate.
on:
  push:
    branches: [diag/issue-3-propagate]

jobs:
  repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build
        run: cargo test --locked --test propagate --no-run
      - name: One nested_on_a run with full debug log
        shell: bash
        env:
          RUST_LOG: debug,hyper=info,h2=info,tantivy=info,redb=info
        run: |
          cargo test --locked --test propagate diag_nested_on_a -- --exact --nocapture > one.log 2>&1 || true
          echo "lines: $(wc -l < one.log)"
          cat one.log
      - name: Variants x10
        shell: bash
        run: |
          for t in diag_nested_on_a diag_nested_on_b diag_flat_both diag_nested_existing_dir_on_a; do
            for i in $(seq 1 10); do
              cargo test --locked --test propagate $t -- --exact --nocapture 2>&1 | grep -E "DIAGV|DIAG .* never|test result: FAILED" || echo "$t #$i: no output"
            done
          done
