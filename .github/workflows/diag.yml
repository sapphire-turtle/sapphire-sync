name: DIAG issue-3

# Temporary: exists only on diag/issue-3-propagate.
on:
  push:
    branches: [diag/issue-3-propagate]

jobs:
  repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build
        run: cargo test --locked --test propagate --no-run
      - name: flat_both x5 with DIAG logs
        shell: bash
        env:
          RUST_LOG: warn,sapphire_framework_server::sync=debug,sapphire_framework_session=debug
          NO_COLOR: "1"
        run: |
          echo "=================== idle"
          cargo test --locked --test propagate diag_idle -- --exact --nocapture 2>&1 \
            | grep -E "DIAG (IDLE|watcher report|scan done|debounce)" || true
          for i in $(seq 1 5); do
            echo "=================== iteration $i"
            cargo test --locked --test propagate diag_flat_both -- --exact --nocapture 2>&1 \
              | grep -E "DIAG|session complete" | sed 's/\x1b\[[0-9;]*m//g' || true
          done
