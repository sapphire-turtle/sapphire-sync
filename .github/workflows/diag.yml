name: DIAG issue-3

# Temporary: exists only on diag/issue-3-propagate. Now verifies the fix
# (sapphire-framework fix/watcher-ignore-access).
on:
  push:
    branches: [diag/issue-3-propagate]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build
        run: cargo test --locked --test propagate --no-run
      - name: Cross-write timings
        shell: bash
        run: |
          for t in diag_flat_both diag_nested_on_a; do
            for i in $(seq 1 10); do
              cargo test --locked --test propagate $t -- --exact --nocapture 2>&1 \
                | grep -E "DIAGV|never converged" || echo "$t #$i: no output"
            done
          done
      - name: pair_and_propagate x30
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 30); do
            if ! cargo test --locked --test propagate pair_and_propagate -- --exact > run.log 2>&1; then
              fails=$((fails+1))
              echo "iteration $i FAILED"
              grep -E "panicked|DIAG" run.log
            fi
          done
          echo "failures: $fails / 30"
